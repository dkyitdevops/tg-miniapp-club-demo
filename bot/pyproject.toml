[project]
name = "tg-miniapp-club-demo-bot"
version = "0.1.0"
description = "Демо-бот Mini App «Кабинет клуба»: готовый текст по метке /start и кнопка обратно в кабинет"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
