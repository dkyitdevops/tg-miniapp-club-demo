name: tg-miniapp-club-demo

services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
